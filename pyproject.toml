[project]
name = "vlrggapi"
version = "2.0.0"
description = "Unofficial REST API that scrapes vlr.gg for Valorant esports data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "cachetools==7.2.8",
    "uvicorn==0.54.0",
    "fastapi==0.162.0",
    "selectolax==1.0.2",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "pip-audit",
    "ruff",
]

[tool.uv]
# This is an application, not a distributable package: there is nothing to
# build or install, `uv sync` only manages the environment.
package = false
